<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MetaJudge AI — Adversarial Hallucination Detection & Correction powered by NVIDIA NIM">
  <title>MetaJudge AI — Hallucination Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>MetaJudge AI</h1>
      <p class="subtitle">Adversarial Hallucination Detection &amp; Correction</p>
      <span class="badge">NVIDIA NIM · Skeptical CoVe-RAG</span>
    </header>

    <!-- Health -->
    <div style="text-align:center;margin-bottom:24px">
      <span class="health-dot" id="health-dot"></span>
      <span id="health-text" style="font-size:0.82rem;color:var(--text-muted)">Checking backend...</span>
    </div>

    <!-- Input Card -->
    <div class="card" id="input-card">
      <h2><span class="icon">🔍</span> Analyze Summary</h2>
      <div class="input-group">
        <textarea id="input-text" placeholder="Paste an AI/ML paper summary to fact-check...&#10;&#10;Example: BERT, introduced by Google in 2018, achieved 80.5% F1 on SQuAD 2.0..."></textarea>
        <div class="controls">
          <select id="mode-select">
            <option value="fast">⚡ Fast Mode</option>
            <option value="full">🔬 Full Mode (deep verify)</option>
          </select>
          <button class="btn btn-primary" id="run-btn">
            <div class="spinner" id="spinner"></div>
            Run MetaJudge
          </button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary" onclick="loadExample(0)">📄 BERT example</button>
          <button class="btn btn-secondary" onclick="loadExample(1)">📄 GPT-4 example</button>
          <button class="btn btn-secondary" onclick="loadExample(2)">📄 LoRA example</button>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">Initializing...</div>
      </div>

      <!-- Log -->
      <div class="log-console" id="log-console"></div>
    </div>

    <!-- Results -->
    <div id="results-section"></div>

    <!-- Footer -->
    <footer class="footer">
      MetaJudge AI v2.0 · Powered by NVIDIA NIM · Skeptical CoVe-RAG Pipeline
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
